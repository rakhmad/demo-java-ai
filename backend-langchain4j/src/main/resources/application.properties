quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000

quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:gpt-5.5}
quarkus.langchain4j.openai.timeout=90s
# Never log prompts/answers: they may contain user data.
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
# How many times the output guardrail may ask the model to rewrite.
quarkus.langchain4j.guardrails.max-retries=2
