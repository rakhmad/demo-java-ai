quarkus.http.port=8081
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000

openai.api-key=${OPENAI_API_KEY}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-5.5}
# Explaining Java rarely needs deep reasoning; low effort answers faster and cheaper.
openai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}

# Camel caches every stream body by default, which would buffer the model's whole streamed answer.
camel.main.stream-caching-enabled=false

# Tracing: every request gets a W3C trace id (continued from the browser's traceparent header).
# Spans are exported only when TRACES_EXPORTER=cdi (OTLP to localhost:4317, see ./scripts/run.sh jaeger).
quarkus.otel.traces.exporter=${TRACES_EXPORTER:none}
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p traceId=%X{traceId} [%c{2.}] %s%e%n

# No containers needed (and no Docker required) in dev mode.
quarkus.devservices.enabled=false
